<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="Split expenses with anyone, even offline." />
    <meta name="apple-mobile-web-app-title" content="Splito" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Splito</title>
    <style>
      @font-face { font-family: 'InterVariable'; src: url('/fonts/InterVariable.woff2') format('woff2'); font-weight: 300 1000; font-style: normal; font-display: swap; }
      @font-face { font-family: 'InterVariableItalic'; src: url('/fonts/InterVariable-Italic.woff2') format('woff2'); font-weight: 300 1000; font-style: italic; font-display: swap; }
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #ffffff; }
      @media (prefers-color-scheme: dark) { body { background: #000000; } }
      #root { display: flex; }
      button, input, textarea { font: inherit; line-height: inherit; }
      /* As Bluesky's src/style.css: fields draw their own focus state. */
      textarea:focus, input:focus { outline: 0; }
    </style>
  </head>
  <body>
    <noscript>Splito needs JavaScript.</noscript>
    <div id="root">
      <!-- Launch mark until the app's first render replaces #root (generated by scripts/brand.ts). -->
      <picture id="launch-mark" aria-hidden="true" style="margin: auto">
        <source srcset="/splash-mark-dark.svg" media="(prefers-color-scheme: dark)" />
        <img src="/splash-mark.svg" width="96" height="96" alt="" />
      </picture>
    </div>
  </body>
</html>
