<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151D28" />
    <meta name="description" content="Split expenses with anyone, even offline." />
    <meta name="apple-mobile-web-app-title" content="Splito" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Splito</title>
    <noscript><style>#launch { display: none; }</style></noscript>
    <style>
      @font-face { font-family: 'InterVariable'; src: url('/fonts/InterVariable.woff2') format('woff2'); font-weight: 300 1000; font-style: normal; font-display: swap; }
      @font-face { font-family: 'InterVariableItalic'; src: url('/fonts/InterVariable-Italic.woff2') format('woff2'); font-weight: 300 1000; font-style: italic; font-display: swap; }
      /* As Bluesky's bskyweb/templates/base.html: the window scrolls (lists use full-window scroll), and the scrollbar is always there so pages never shift. */
      html, body, #root { display: flex; flex: 1 0 auto; min-height: 100%; width: 100%; }
      html, body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
      body { overflow-y: scroll; background: #ffffff; }
      /* ALF Dim's background, never pure black (src/alf/splash.test.ts). */
      @media (prefers-color-scheme: dark) { body { background: #151D28; } }
      /* Taps act at once: no double-tap-to-zoom wait, and a quick second tap on the bottom bar is never taken for a zoom (iOS Safari). Panning and pinch-zoom still work. */
      html { touch-action: manipulation; }
      button, input, textarea { font: inherit; line-height: inherit; }
      /* As Bluesky's src/style.css: fields draw their own focus state. */
      textarea:focus, input:focus { outline: 0; }
      /* Date fields already show a calendar icon on the left; the browser's own picker button becomes the whole field (clear, and one click anywhere opens it). */
      input[type="date"] { position: relative; }
      input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: auto; height: auto; margin: 0; padding: 0; opacity: 0; cursor: pointer; }
      /* The Loader's turn, and the pull to refresh spinner's (Bluesky's bskyweb/templates/base.html .rotate-500ms). */
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .rotate-500ms { animation: rotate 500ms linear infinite; }
      /* Keyframes for the ALF animation atoms (fade_in, zoom_fade_in, slide_in_left ...), as Bluesky's src/style.css. */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
      @keyframes zoomIn { from { transform: scale(0.95); } to { transform: scale(1); } }
      @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
      @keyframes slideOutLeft { from { transform: translateX(0); } to { transform: translateX(-100%); } }
      /* Splito: phone-width sheets rise from the bottom edge. */
      @keyframes slideInUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      /*
       * Launch screen (ARCHITECTURE 26.11, owner 185): fixed over #root so the app renders underneath and nothing shifts when
       * it fades out (src/components/LaunchScreen/index.web.tsx). Same background as the body, Dim in dark mode.
       */
      #launch { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: #ffffff; }
      @media (prefers-color-scheme: dark) { #launch { background: #151D28; } }
      /* The mark breathes from first paint, before any script: scale 1 -> 1.08 -> 1, 1.2 s, ease-in-out. */
      @keyframes launchBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes launchPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      #launch-mark img { display: block; animation: launchBreathe 1.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { #launch-mark img { animation: launchPulse 2.4s ease-in-out infinite; } }
    </style>
  </head>
  <body>
    <noscript>Splito needs JavaScript.</noscript>
    <div id="root"></div>
    <!-- Launch mark until the store is open (StoreProvider -> markLaunchReady fades it out); mark generated by scripts/brand.ts. -->
    <div id="launch" aria-hidden="true">
      <picture id="launch-mark">
        <source srcset="/splash-mark-dark.svg" media="(prefers-color-scheme: dark)" />
        <img src="/splash-mark.svg" width="96" height="96" alt="" />
      </picture>
    </div>
  </body>
</html>
